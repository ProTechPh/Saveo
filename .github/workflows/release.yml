name: Build and Publish Releases (Windows & Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------- 0. VERSION CALCULATION & AUTO-INCREMENT ----------------
  prepare-version:
    name: Calculate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      version_code: ${{ steps.calc.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate Next Version
        id: calc
        env:
          CUSTOM_TAG: ${{ inputs.tag_name }}
        run: |
          python3 scripts/calculate_version.py \
            --event "${{ github.event_name }}" \
            --ref-type "${{ github.ref_type }}" \
            --ref-name "${{ github.ref_name }}" \
            --custom-tag "$CUSTOM_TAG"

  # ---------------- 1. WINDOWS STANDALONE BUILD (STABLE) ----------------
  build-windows:
    name: Build Windows (x64)
    needs: prepare-version
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Configure Version Metadata
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-version.outputs.version }}"
          $tag = "${{ needs.prepare-version.outputs.tag }}"
          Write-Host "Configuring Saveo version: $tag (Clean: $ver)"
          Set-Content -Path VERSION -Value $ver
          python scripts/sync_version.py
          "SAVEO_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION_CLEAN=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Standalone (Windows)
        run: |
          pyinstaller --noconfirm --name Saveo --onedir --windowed --noconsole --icon Saveo.ico --splash "assets/splash.png" --add-data "web;web" --add-data "assets;assets" --add-data "Saveo.ico;." --add-data "VERSION;." --collect-all imageio_ffmpeg --collect-all pywebview --collect-all pythonnet --hidden-import tkinter --hidden-import tkinter.filedialog --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          New-Item -ItemType Directory -Force -Path dist/Saveo/bin
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Copy-Item (Get-Command ffmpeg).Source -Destination dist/Saveo/bin/ffmpeg.exe
          } else {
            python -c "import shutil, imageio_ffmpeg; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), 'dist/Saveo/bin/ffmpeg.exe')"
          }
          Copy-Item Saveo.ico -Destination dist/Saveo/Saveo.ico -Force
          Copy-Item VERSION -Destination dist/Saveo/VERSION -Force
          Compress-Archive -Path dist/Saveo -DestinationPath Saveo-Windows-x64.zip -Force

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Compiling Inno Setup using: $iscc with version: $env:RELEASE_VERSION_CLEAN"
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION_CLEAN" installer.iss
          if (-not (Test-Path "dist/Saveo-Setup.exe")) {
            Write-Error "Installer executable was not created in dist!"
            exit 1
          }
          Move-Item dist/Saveo-Setup.exe Saveo-Setup.exe -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Saveo-Windows-Packages
          path: |
            Saveo-Setup.exe
            Saveo-Windows-x64.zip

  # ---------------- 2. ANDROID STANDALONE APK BUILD ----------------
  build-android:
    name: Build Android (APK)
    needs: prepare-version
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configure Version Metadata
        run: |
          echo "${{ needs.prepare-version.outputs.version }}" > VERSION
          python3 scripts/sync_version.py
          python3 scripts/sync_web_assets.py

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        env:
          PYTHON_BINARY_PATH: ${{ steps.setup-python.outputs.python-path }}
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          cd android
          PY_BIN="${{ steps.setup-python.outputs.python-path }}"
          echo "Using Python binary for Chaquopy: $PY_BIN"
          echo "Building Saveo APK version: $APP_VERSION (versionCode: $APP_VERSION_CODE)"
          ./gradlew assembleRelease -PpythonBinary="$PY_BIN" -PversionName="$APP_VERSION" -PversionCode="$APP_VERSION_CODE" --no-daemon --stacktrace
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          cp "$APK_FILE" Saveo-Android.apk
          ls -lh Saveo-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saveo-Android.apk
          path: Saveo-Android.apk

  # ---------------- 3. PUBLISH TO GITHUB RELEASE ----------------
  publish-release:
    name: Publish Release Assets
    needs: [prepare-version, build-windows, build-android]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !cancelled() && needs.build-windows.result == 'success'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Generate Release Notes
        run: python3 scripts/generate_release_notes.py "${{ needs.prepare-version.outputs.tag }}"

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          files: release-assets/*
          name: Saveo ${{ needs.prepare-version.outputs.tag }} - Windows & Android Release
          body_path: release_body.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync VERSION file back to main branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ needs.prepare-version.outputs.version }}" > VERSION
          python3 scripts/sync_version.py --finalize
          python3 scripts/sync_web_assets.py
          git add VERSION CHANGELOG.md site web server android installer.iss
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ needs.prepare-version.outputs.tag }} [skip ci]"
            git push origin main
          fi
